<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Amina Moutalibova</title>

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png">
  <link rel="shortcut icon" href="/favicon.ico" size="any">

  <!-- Primary SEO -->
  <meta name="description" content="Contact met Amina Moutalibova" />
  <link rel="canonical" href="https://amina-moutalibova.be/contact.html" />
  <meta name="theme-color" content="#DE0043" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="Amina Moutalibova" />

  <!-- Perf: preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    
  <!-- Styles -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fonts.css">
  <script src="js/site-nav.js" defer></script>
</head>
<body>
  <main class="page">
    <div data-site-nav data-nav-variant="default" data-nav-logo="black" data-nav-active="contact"></div>

    <section class="contact-hero">
      <div class="contact-hero__content">
        <h1 class="contact-hero__title">Ready to bring ideas to life?</h1>
        <p class="contact-hero__subtitle">Have a project in mind, a job opportunity or just want to connect? I'm always open to interesting conversations.</p>
      </div>

      <form class="contact-form" name="contact" method="POST" action="https://formspree.io/f/mnjrpodq" accept-charset="UTF-8">
        <input type="hidden" name="_subject" value="Bericht via Amina haar website">
        <p hidden>
          <label>Laat dit veld leeg als je een mens bent: <input name="_gotcha"></label>
        </p>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="Write your message here" rows="6" required></textarea>
        </div>
        <button type="submit" class="contact-form__button">Send</button>
        <div class="form-feedback" aria-live="polite" role="status" style="display:none;margin-top:16px;color:var(--muted);"></div>
      </form>
    </section>

		<section class="contact" id="contact">
			<h2>Get in touch</h2>
			<div class="buttons">
				<a class="secondary" href="mailto:amoutalibova@gmail.com">Email</a>
				<a class="secondary" href="https://www.linkedin.com/in/amina-moutalibova" target="_blank" rel="noreferrer">LinkedIn</a>
			</div>
      <img src="./images/vectors/logo-white.svg" alt="" class="bg-img" aria-hidden="true">
		</section>

		
	</main>
	<footer class="footer">
            <img src="./images/vectors/logo-white.svg" alt="Amina Moutalibova logo" class="logo">
			<div class="footer-nav">
				<a href="projects.html">Projects</a>
				<a href="contact.html">Contact</a>
			</div>
			<p class="copyright">
        <span>&copy;</span> 
        2026 Amina Moutalibova
      </p>
		</footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollToPlugin.min.js"></script>
  <script src="./js/gsap-site.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.querySelector('.contact-form');
      const feedback = document.querySelector('.form-feedback');

      if (!form || !feedback) return;

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const submitButton = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);

        submitButton.disabled = true;

        fetch(form.action, {
          method: 'POST',
          headers: {
            Accept: 'application/json'
          },
          body: formData
        })
          .then(function (response) {
            if (response.ok) {
              feedback.style.display = 'block';
              feedback.style.color = 'green';
              feedback.textContent = 'Thank you for your message! I will get back to you as soon as possible.';
              form.reset();
              return;
            }

            throw new Error('Form submission failed');
          })
          .catch(function () {
            feedback.style.display = 'block';
            feedback.style.color = 'red';
            feedback.textContent = 'Something went wrong. Try again later.';
          })
          .finally(function () {
            submitButton.disabled = false;
          });
      });
    });
  </script>
</body>
</html>
