<body>
  <main class="page">
    <header class="nav">
      <div class="logo" aria-label="logo"><a href="index.html"><img src="./images/vectors/logo-black.svg" alt="Amina Moutalibova logo"></a></div>
      <nav class="nav-links" aria-label="Main navigation">
        <a class="primary" href="projects.html">Projects</a>
        <a class="primary active" href="contact.html">Contact</a>
      </nav>
    </header>

    <section class="contact-hero">
      <div class="contact-hero__content">
        <h1 class="contact-hero__title">Ready to bring ideas to life?</h1>
        <p class="contact-hero__subtitle">Have a project in mind, a job opportunity or just want to connect? I'm always open to interesting conversations.</p>
        <div class="contact-hero__social">
          <a href="https://www.linkedin.com/in/aminamoutalibova/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
            <img src="./images/linkedin-logo.png" alt="LinkedIn">
          </a>
          <a href="https://www.instagram.com/amina.designs/" target="_blank" rel="noreferrer" aria-label="Instagram">
            <img src="./images/instagram-logo.png" alt="Instagram">
          </a>
        </div>
      </div>

      <form class="contact-form" name="contact" method="POST" netlify>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="message" class="form-label">Message</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="Write your message here" rows="6" required></textarea>
        </div>
        <button type="submit" class="contact-form__button">Send</button>
      </form>
    </section>

    <section class="contact-cta">
      <h2>Get in touch</h2>
      <div class="contact-cta__buttons">
        <a href="mailto:amina_moutalibov@hotmail.com" class="contact-cta__button">Email</a>
        <a href="https://www.linkedin.com/in/aminamoutalibova/" target="_blank" rel="noreferrer" class="contact-cta__button">LinkedIn</a>
      </div>
      <img src="./images/vectors/logo-white.svg" alt="" class="contact-cta__logo" aria-hidden="true">
    </section>
  </main>

  <footer class="footer">
    <img src="./images/vectors/logo-white.svg" alt="Amina Moutalibova logo" class="logo">
    <div class="footer-nav">
      <a href="index.html#projects">Projects</a>
      <a href="contact.html">Contact</a>
    </div>
