  <script src="./js/gsap-site.js"></script>
  <script>
    const showcase = document.querySelector('.projects-showcase');
    const titleEl = document.getElementById('projects-showcase-title');
    const imageEl = document.getElementById('projects-image-display');
    const items = Array.from(document.querySelectorAll('.showcase-item'));
    const originalTitle = 'My Projects';

    function setActiveItem(item) {
      if (!item) return;
      const imageSrc = item.getAttribute('data-image');
      const projectName = item.getAttribute('data-name');

      if (imageSrc && imageEl) {
        imageEl.src = imageSrc;
      }
      if (projectName && titleEl) {
        titleEl.textContent = projectName;
      }
      if (showcase) {
        showcase.classList.add('has-active-project');
      }

      items.forEach(current => {
        current.classList.toggle('is-active', current === item);
      });
    }

    function clearActiveItem() {
      if (titleEl) {
        titleEl.textContent = originalTitle;
      }
      if (showcase) {
        showcase.classList.remove('has-active-project');
      }
      items.forEach(current => current.classList.remove('is-active'));
    }

    items.forEach(item => {
      item.addEventListener('mouseenter', () => setActiveItem(item));
      item.addEventListener('focus', () => setActiveItem(item));
      item.addEventListener('mouseleave', clearActiveItem);
      item.addEventListener('blur', clearActiveItem);
    });
  </script>
