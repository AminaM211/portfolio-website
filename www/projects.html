  <script>
    // Update image and title on project hover
    const titleEl = document.getElementById('projects-showcase-title');
    const originalTitle = 'My Projects';
    
    document.querySelectorAll('.showcase-item').forEach(item => {
      item.addEventListener('mouseenter', () => {
        const imageSrc = item.getAttribute('data-image');
        const projectName = item.getAttribute('data-name');
        const imageHolder = document.getElementById('projects-image-display');
        if (imageSrc && imageHolder) {
          imageHolder.src = imageSrc;
        }
        if (projectName && titleEl) {
          titleEl.textContent = projectName;
        }
      });
      
      item.addEventListener('mouseleave', () => {
        if (titleEl) {
          titleEl.textContent = originalTitle;
        }
      });
    });
  </script>
