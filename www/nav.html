<header class="site-header">
  <style>
    .site-header {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 20;
      pointer-events: none;
    }

    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      width: min(1100px, calc(100% - 4rem));
      margin: 0 auto;
      padding: 24px 0;
      pointer-events: auto;
    }

    .site-logo img {
      display: block;
      width: 52px;
      height: auto;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      font: 400 1rem/1.2 Manuale, serif;
      border-bottom: 1px solid currentColor;
      padding-bottom: 2px;
    }

    .hamburger {
      display: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      margin: 5px auto;
      background: #fff;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    @media (max-width: 860px) {
      .site-header__inner {
        width: min(100%, calc(100% - 2rem));
        padding: 18px 0;
      }

      .hamburger {
        display: block;
        order: 2;
      }

      .nav-links {
        position: absolute;
        top: 72px;
        right: 1rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 10px;
        border-radius: 16px;
        background: rgba(15, 15, 17, 0.92);
        backdrop-filter: blur(18px);
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .nav-links.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .nav-links a {
        padding: 12px 16px;
        border-bottom: 0;
        border-radius: 12px;
      }
    }
  </style>
  <div class="site-header__inner">
    <a class="site-logo" href="index.html" aria-label="Home">
      <img src="./images/vectors/logo-color.svg" alt="Amina Moutalibova">
    </a>
    <button class="hamburger" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="index.html#projects">Projects</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>
