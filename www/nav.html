<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nav - Amina</title>
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    :root{ --nav-h:80px; 
       --primairy-color: #9b2c1a;
    }

    .site-header{
      position: fixed; inset: 0 auto auto 0; right: 0;
      height: var(--nav-h);
      z-index: 10000;
      background-color: #ffffff3a;
      backdrop-filter: saturate(100%) blur(10px);
      -webkit-backdrop-filter: saturate(100%) blur(10px);
      transform: translateY(0);
      transition: transform 220ms ease, box-shadow 220ms ease;
      will-change: transform;
    }
    .site-header.nav--hidden{ transform: translateY(-100%); }
    .site-header.nav--scrolled{ box-shadow: 0 8px 24px rgba(0,0,0,.08); }

    .nav{
      max-width: 1400px; margin: 0 auto;
      display:flex; justify-content:space-between; align-items:center;
      padding: 0 40px; height: var(--nav-h);
    }
    .brand{
      display:inline-flex; align-items:center; gap:1rem;
    }

    .brand img{
      height: 30px; 
    }

    .nav-links {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .pill2 {
    /* padding: 0.5rem 1.3rem; */
    width: 110px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 999px;
    background: #00346B;
    /* border: 1px solid #00346B; */
    color: var(--primairy-color);
    font-family: Marcellus, serif;
    font-weight: 400;
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .pill {
    /* padding: 0.5rem 1.3rem; */
    width: 110px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 999px;
    background: #ffffff85;
    border: 1px solid var(--primairy-color);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
    color:  var(--primairy-color);
    font-family: Marcellus, serif;
    font-weight: 400;
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .pill2:hover {
    border-radius: 999px;
    background: #ffffff85;
    border: 1px solid var(--primairy-color);
    color:  var(--primairy-color);
    font-family: Marcellus, serif;
    font-weight: 400;
    text-decoration: none;
    transition: all 0.25s ease;
    transform: translateY(-3px);
  }

  .pill:hover{
    background: var(--primairy-color);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
    transform: translateY(-3px);
  }

  .pill2 {
    background: var(--primairy-color);
    color: #fff;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
  }
    @media (min-width:1500px){ .nav{ padding:0 10%; } }
    @media (max-width:425px){
      .nav-links{ gap:0.5em; flex-wrap: nowrap; }
      .pill, .pill2{ padding:0.4rem 1rem; font-size: clamp(1em,3vw,20px); }
      .brand{ font-size: clamp(30px,6vw,40px); }
      nav {
        padding: 0 15px;;
      }
    }
    @media (prefers-reduced-motion: reduce){ .site-header{ transition:none; } }
  </style>
</head>
<body>
  <header class="site-header" id="site-header">
    <div class="nav">
      <a class="brand" href="/"><img src="AMVA_alt.svg" alt="AMVA logo"></a>
      <nav class="nav-links" id="nav-links">
        <a class="pill" href="index.html#tag" tabindex="1">Projecten</a>
        <a class="pill2" href="#footer-placeholder" tabindex="2">Contact</a>
      </nav>
    </div>
  </header>
</body>
</html>
